<iframe xmlns="http://www.w3.org/1999/xhtml" data-svghost="" allowfullscreen="" allow="autoplay; fullscreen; clipboard-read; clipboard-write" style="border:0;margin:0;padding:0;width:100%;height:100%;display:block" srcdoc="&lt;html lang=&quot;en&quot;&gt;&#10;  &lt;head&gt;&lt;base href=&quot;https://cdn.jsdelivr.net/gh/summonthespirit/geo/&quot;&gt;&#10;  &lt;meta charset=&quot;UTF-8&quot;&gt;&#10;  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;&#10;  &lt;title&gt;Google&lt;/title&gt;&#10;  &lt;link rel=&quot;icon&quot; href=&quot;https://google.com/favicon.ico&quot;&gt;&#10;  &lt;link rel=&quot;stylesheet&quot; href=&quot;https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css&quot;&gt;&#10;  &lt;script src=&quot;cloak.js&quot;&gt;&lt;/script&gt;&#10;  &lt;style&gt;&#10;    :root {&#10;        --bg-dark: #0f141c;&#10;        --surface: rgba(22, 29, 41, 0.85);&#10;        --border: #2a384d;&#10;        --glow: #0084ff;&#10;        --text-color: #ffffff;&#10;        --text-muted: #8a9bb5;&#10;    }&#10;&#10;    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }&#10;&#10;    body {&#10;        margin: 0;&#10;        padding: 0;&#10;        color: var(--text-color);&#10;        font-family: &quot;Sora&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif;&#10;        position: relative;&#10;        overflow: hidden;&#10;        background-color: var(--bg-dark);&#10;        height: 100vh;&#10;    }&#10;    &#10;    #ad {&#10;    position: fixed;&#10;    top: calc(54% + 50px);&#10;    left: 50%;&#10;    transform: translateX(-50%);&#10;    width: 728px;&#10;    height: 90px;&#10;    z-index: 2;&#10;  }&#10;&#10;@media (max-width: 760px) {&#10;  #ad { display: none; }&#10;}&#10;&#10;&#10;body:has(#browser.visible) #ads { &#10;  display: none;&#10;}&#10;&#10;    .background-video { &#10;        position: fixed; &#10;        inset: 0; &#10;        z-index: 0; &#10;        width: 100vw; &#10;        height: 100vh; &#10;        object-fit: cover; &#10;        pointer-events: none;&#10;        filter: brightness(0.8);&#10;    }&#10;&#10;    header {&#10;        display: flex;&#10;        flex-direction: row;&#10;        justify-content: space-between;&#10;        align-items: center;&#10;        height: 60px;&#10;        padding: 0 2rem;&#10;        position: relative;&#10;        z-index: 10;&#10;        background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);&#10;    }&#10;&#10;    input, button, select {&#10;        background: var(--surface);&#10;        color: var(--text-color);&#10;        border: 1px solid var(--border);&#10;        border-radius: 6px;&#10;        padding: 8px 16px;&#10;        user-select: none;&#10;        font-weight: 600;&#10;        letter-spacing: 0.5px;&#10;        backdrop-filter: blur(8px);&#10;        transition: all 0.2s ease;&#10;    }&#10;&#10;    button:hover, input:focus {&#10;        border-color: var(--glow);&#10;        box-shadow: 0 0 12px rgba(0, 132, 255, 0.4);&#10;        outline: none;&#10;    }&#10;&#10;    .title {&#10;        position: fixed;&#10;        top: 40%;&#10;        left: 50%;&#10;        transform: translate(-50%, -50%);&#10;        z-index: 2;&#10;        pointer-events: none;&#10;        margin: 0;&#10;        text-align: center;&#10;    }&#10;&#10;    .title img {&#10;        max-width: min(250px, 75vw);&#10;        width: 100%;&#10;        height: auto;&#10;        object-fit: contain;&#10;        filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.8));&#10;    }&#10;&#10;    #search {&#10;        position: fixed;&#10;        top: 54%;&#10;        left: 50%;&#10;        transform: translate(-50%, -50%);&#10;        z-index: 2;&#10;        pointer-events: auto;&#10;        margin: 0;&#10;        text-align: center;&#10;        transition: all 0.3s ease;&#10;    }&#10;&#10;    #search input {&#10;        width: min(480px, 85vw);&#10;        height: 52px;&#10;        border-radius: 26px;&#10;        text-align: center;&#10;        background: rgba(15, 20, 28, 0.75);&#10;        border: 2px solid rgba(255, 255, 255, 0.15);&#10;        color: #ffffff;&#10;        font-size: 1.05rem;&#10;        backdrop-filter: blur(12px);&#10;        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);&#10;        font-family: 'Sora', sans-serif;&#10;    }&#10;&#10;    #search input::placeholder {&#10;        color: var(--text-muted);&#10;    }&#10;&#10;    #search input:focus {&#10;        border-color: #ffffff;&#10;        box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);&#10;    }&#10;&#10;      #loading-screen {&#10;        position: fixed;&#10;        inset: 0;&#10;        z-index: 2147483647;&#10;        background: #0f141c;&#10;        opacity: 1;&#10;        transition: opacity 0.5s ease;&#10;      }&#10;    &#10;    #loading-screen.hide {&#10;      opacity: 0;&#10;      pointer-events: none;&#10;    }&#10;&#10;    #loading-screen img {&#10;      width: 100%;&#10;      height: 100%;&#10;      object-fit: cover;&#10;      display: block;&#10;    }&#10;&#10;    #status {&#10;      position: fixed;&#10;      bottom: 2rem;&#10;      left: 50%;&#10;      transform: translateX(-50%);&#10;      font-size: 0.78rem;&#10;      color: rgba(255,255,255,0.4);&#10;      z-index: 10;&#10;      letter-spacing: 0.03em;&#10;    }&#10;&#10;    #overlay {&#10;        position: fixed;&#10;        inset: 0;&#10;        background-color: rgba(10, 14, 20, 0.85);&#10;        backdrop-filter: blur(6px);&#10;        opacity: 0;&#10;        pointer-events: none;&#10;        transition: opacity 0.25s ease;&#10;        z-index: 100;&#10;    }&#10;&#10;    #overlay.active {&#10;        opacity: 1;&#10;        pointer-events: auto;&#10;    }&#10;&#10;    #settings {&#10;        display: flex;&#10;        flex-direction: column;&#10;        position: fixed;&#10;        top: 50%;&#10;        left: 50%;&#10;        transform: translate(-50%, -50%);&#10;        width: min(90vw, 440px);&#10;        max-height: 80vh;&#10;        background: var(--surface);&#10;        border: 1.5px solid var(--border);&#10;        border-radius: 12px;&#10;        padding: 24px;&#10;        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);&#10;        backdrop-filter: blur(16px);&#10;        z-index: 101;&#10;    }&#10;&#10;    #settings h3 {&#10;        margin-top: 0;&#10;        text-transform: uppercase;&#10;        letter-spacing: 1.5px;&#10;        font-size: 1.1rem;&#10;        color: #ffffff;&#10;        border-bottom: 1px solid var(--border);&#10;        padding-bottom: 12px;&#10;    }&#10;&#10;    #gear {&#10;        cursor: pointer;&#10;        font-size: 20px;&#10;    }&#10;&#10;    #browser {&#10;        position: fixed;&#10;        inset: 0;&#10;        width: 100vw;&#10;        height: 100vh;&#10;        border: none;&#10;        background: var(--bg-dark);&#10;        z-index: 312456643241354676563424365476856746353454657;&#10;        display: none;&#10;    }&#10;    &#10;    #browser.visible { &#10;      display: block; &#10;    }&#10;&#10;    #load-bar {&#10;      position: fixed;&#10;      top: 0; left: 0;&#10;      height: 3px;&#10;      width: 0%;&#10;      background: #ffffff;&#10;      box-shadow: 0 0 6px rgba(126,200,255,0.6);&#10;      z-index: 25;&#10;      opacity: 0;&#10;      border-radius: 0 2px 2px 0;&#10;      &#10;      body:has(#browser.visible) &gt; :not(#browser):not(script):not(style):not(link):not(noscript),&#10;html:has(#browser.visible) &gt; :not(head):not(body) {&#10;  display: none !important;&#10;}&#10;    }&#10;  &lt;/style&gt;&#10;  &lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;&#10;  &lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin=&quot;&quot;&gt;&#10;  &lt;link href=&quot;https://fonts.googleapis.com/css2?family=Sora:wght@100..800&amp;amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;&#10;&lt;/head&gt;&#10;&lt;body class=&quot;default&quot;&gt;&#10;  &lt;video class=&quot;background-video&quot; id=&quot;background-video&quot; autoplay=&quot;true&quot; muted playsinline=&quot;true&quot; preload=&quot;auto&quot; aria-hidden=&quot;true&quot; loop=&quot;&quot;&gt;&#10;    &lt;source src=&quot;https://cdn.jsdelivr.net/gh/summonthespirit/hosting-2@main/Roblox's%20Old%20Xbox%20One%20UI%20Background%20Animation%20(HQ)%20(4K).mp4&quot; type=&quot;video/mp4&quot;&gt;&#10;  &lt;/video&gt;&#10;  &#10;  &lt;header&gt;&#10;   &lt;span id=&quot;gear&quot;&gt;&lt;i class=&quot;fa-solid fa-gear&quot;&gt;&lt;/i&gt;&lt;/span&gt;&#10;  &lt;/header&gt;&#10;&#10;  &lt;div class=&quot;title&quot;&gt;&#10;    &lt;img src=&quot;img/logo.png&quot; alt=&quot;logo&quot;&gt;&#10;  &lt;/div&gt;&#10;&#10;  &lt;form id=&quot;search&quot;&gt;&#10;    &lt;input id=&quot;url&quot; type=&quot;text&quot; class=&quot;search-input search&quot; placeholder=&quot;search the web or enter a url.&quot; autocomplete=&quot;off&quot; autocorrect=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&#10;  &lt;/form&gt;&#10;&#10;  &#10;  &lt;p id=&quot;status&quot;&gt;&lt;/p&gt;&#10;&#10;  &lt;div id=&quot;overlay&quot; class=&quot;&quot;&gt;&#10;    &lt;div id=&quot;settings&quot; class=&quot;&quot;&gt;&#10;      &lt;h3&gt;settings&lt;/h3&gt;&#10;    &lt;br&gt;&#10;      &lt;h4&gt;transport&lt;/h4&gt;&#10;    &lt;br&gt;&#10;      &lt;label&gt;&#10;        &lt;input type=&quot;radio&quot; name=&quot;transport&quot; value=&quot;libcurl&quot;&gt; libcurl&#10;      &lt;/label&gt;&#10;      &lt;br&gt;&#10;      &lt;label&gt;&#10;        &lt;input type=&quot;radio&quot; name=&quot;transport&quot; value=&quot;epoxy&quot; checked=&quot;&quot;&gt; epoxy (default)&#10;      &lt;/label&gt;&#10;    &lt;br&gt;&#10;      &lt;h4&gt;search engine&lt;/h4&gt;&#10;      &lt;br&gt;&#10;      &lt;select id=&quot;searchEnginePicker&quot; style=&quot;width:100%;&quot;&gt;&#10;        &lt;option value=&quot;google&quot;&gt;google&lt;/option&gt;&#10;        &lt;option value=&quot;bing&quot;&gt;bing&lt;/option&gt;&#10;        &lt;option value=&quot;duckduckgo&quot;&gt;duckduckgo&lt;/option&gt;&#10;        &lt;option value=&quot;brave&quot;&gt;brave&lt;/option&gt;&#10;      &lt;/select&gt;&#10;      &lt;br&gt;&#10;      &lt;h4&gt;tab cloak&lt;/h4&gt;&#10;      &lt;select id=&quot;cloak&quot; style=&quot;width:100%;&quot;&gt;&#10;        &lt;option value=&quot;aboutblank&quot;&gt;about:blank&lt;/option&gt;&#10;        &lt;option value=&quot;blob&quot;&gt;blob url&lt;/option&gt;&#10;        &lt;option value=&quot;off&quot;&gt;off&lt;/option&gt;&#10;      &lt;/select&gt;&#10;      &lt;small style=&quot;color:var(--text-muted);&quot;&gt;applies next time the site opens&lt;/small&gt;&#10;    &lt;/div&gt;&#10;  &lt;/div&gt;&#10;&#10;  &lt;iframe id=&quot;browser&quot; sandbox=&quot;allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads&quot; allow=&quot;autoplay; fullscreen&quot;&gt;&lt;/iframe&gt;&#10;  &lt;div id=&quot;load-bar&quot;&gt;&lt;/div&gt;&#10;&#10;  &lt;script src=&quot;app.js&quot; type=&quot;module&quot;&gt;&lt;/script&gt;&#10;&lt;/body&gt;&#10;&lt;/html&gt;"></iframe>
