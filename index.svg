<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">\n<title></title>\n<rect width="100%" height="100%" fill="#0f141c"/>\n<foreignObject x="0" y="0" width="100%" height="100%">\n<iframe xmlns="http://www.w3.org/1999/xhtml" data-svghost="" allowfullscreen="" allow="autoplay; fullscreen; clipboard-read; clipboard-write" style="border:0;margin:0;padding:0;width:100%;height:100%;display:block" srcdoc="&lt;html lang=&quot;en&quot;&gt;
  &lt;head&gt;&#10;&lt;base href=&quot;https://cdn.jsdelivr.net/gh/summonthespirit/geo@main/&quot;&gt;
  &lt;meta charset=&quot;UTF-8&quot;&gt;
  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
  &lt;title&gt;Google&lt;/title&gt;
  &lt;link rel=&quot;icon&quot; href=&quot;https://google.com/favicon.ico&quot;&gt;
  &lt;link rel=&quot;stylesheet&quot; href=&quot;https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css&quot;&gt;
  &lt;script src=&quot;cloak.js&quot;&gt;&lt;/script&gt;
  &lt;style&gt;
    :root {
        --bg-dark: #0f141c;
        --surface: rgba(22, 29, 41, 0.85);
        --border: #2a384d;
        --glow: #0084ff;
        --text-color: #ffffff;
        --text-muted: #8a9bb5;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        margin: 0;
        padding: 0;
        color: var(--text-color);
        font-family: &quot;Sora&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif;
        position: relative;
        overflow: hidden;
        background-color: var(--bg-dark);
        height: 100vh;
    }
    
    #ad {
    position: fixed;
    top: calc(54% + 50px);
    left: 50%;
    transform: translateX(-50%);
    width: 728px;
    height: 90px;
    z-index: 2;
  }

@media (max-width: 760px) {
  #ad { display: none; }
}


body:has(#browser.visible) #ads { 
  display: none;
}

    .background-video { 
        position: fixed; 
        inset: 0; 
        z-index: 0; 
        width: 100vw; 
        height: 100vh; 
        object-fit: cover; 
        pointer-events: none;
        filter: brightness(0.8);
    }

    header {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        height: 60px;
        padding: 0 2rem;
        position: relative;
        z-index: 10;
        background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
    }

    input, button, select {
        background: var(--surface);
        color: var(--text-color);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 16px;
        user-select: none;
        font-weight: 600;
        letter-spacing: 0.5px;
        backdrop-filter: blur(8px);
        transition: all 0.2s ease;
    }

    button:hover, input:focus {
        border-color: var(--glow);
        box-shadow: 0 0 12px rgba(0, 132, 255, 0.4);
        outline: none;
    }

    .title {
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        pointer-events: none;
        margin: 0;
        text-align: center;
    }

    .title img {
        max-width: min(250px, 75vw);
        width: 100%;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.8));
    }

    #search {
        position: fixed;
        top: 54%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        pointer-events: auto;
        margin: 0;
        text-align: center;
        transition: all 0.3s ease;
    }

    #search input {
        width: min(480px, 85vw);
        height: 52px;
        border-radius: 26px;
        text-align: center;
        background: rgba(15, 20, 28, 0.75);
        border: 2px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
        font-size: 1.05rem;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        font-family: 'Sora', sans-serif;
    }

    #search input::placeholder {
        color: var(--text-muted);
    }

    #search input:focus {
        border-color: #ffffff;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: #0f141c;
        opacity: 1;
        transition: opacity 0.5s ease;
      }
    
    #loading-screen.hide {
      opacity: 0;
      pointer-events: none;
    }

    #loading-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #status {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
      z-index: 10;
      letter-spacing: 0.03em;
    }

    #overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(10, 14, 20, 0.85);
        backdrop-filter: blur(6px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 100;
    }

    #overlay.active {
        opacity: 1;
        pointer-events: auto;
    }

    #settings {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(90vw, 440px);
        max-height: 80vh;
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(16px);
        z-index: 101;
    }

    #settings h3 {
        margin-top: 0;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-size: 1.1rem;
        color: #ffffff;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
    }

    #gear {
        cursor: pointer;
        font-size: 20px;
    }

    #browser {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        border: none;
        background: var(--bg-dark);
        z-index: 312456643241354676563424365476856746353454657;
        display: none;
    }
    
    #browser.visible { 
      display: block; 
    }

    #load-bar {
      position: fixed;
      top: 0; left: 0;
      height: 3px;
      width: 0%;
      background: #ffffff;
      box-shadow: 0 0 6px rgba(126,200,255,0.6);
      z-index: 25;
      opacity: 0;
      border-radius: 0 2px 2px 0;
      
      body:has(#browser.visible) &gt; :not(#browser):not(script):not(style):not(link):not(noscript),
html:has(#browser.visible) &gt; :not(head):not(body) {
  display: none !important;
}
    }
  &lt;/style&gt;
  &lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;
  &lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.gstatic.com&quot; crossorigin=&quot;&quot;&gt;
  &lt;link href=&quot;https://fonts.googleapis.com/css2?family=Sora:wght@100..800&amp;amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;/head&gt;
&lt;body class=&quot;default&quot;&gt;
  &lt;video class=&quot;background-video&quot; id=&quot;background-video&quot; autoplay=&quot;true&quot; muted playsinline=&quot;true&quot; preload=&quot;auto&quot; aria-hidden=&quot;true&quot; loop=&quot;&quot;&gt;
    &lt;source src=&quot;https://cdn.jsdelivr.net/gh/summonthespirit/hosting-2@main/Roblox's%20Old%20Xbox%20One%20UI%20Background%20Animation%20(HQ)%20(4K).mp4&quot; type=&quot;video/mp4&quot;&gt;
  &lt;/video&gt;
  
  &lt;header&gt;
   &lt;span id=&quot;gear&quot;&gt;&lt;i class=&quot;fa-solid fa-gear&quot;&gt;&lt;/i&gt;&lt;/span&gt;
  &lt;/header&gt;

  &lt;div class=&quot;title&quot;&gt;
    &lt;img src=&quot;img/logo.png&quot; alt=&quot;logo&quot;&gt;
  &lt;/div&gt;

  &lt;form id=&quot;search&quot;&gt;
    &lt;input id=&quot;url&quot; type=&quot;text&quot; class=&quot;search-input search&quot; placeholder=&quot;search the web or enter a url.&quot; autocomplete=&quot;off&quot; autocorrect=&quot;off&quot; spellcheck=&quot;false&quot;&gt;
  &lt;/form&gt;

  
  &lt;p id=&quot;status&quot;&gt;&lt;/p&gt;

  &lt;div id=&quot;overlay&quot; class=&quot;&quot;&gt;
    &lt;div id=&quot;settings&quot; class=&quot;&quot;&gt;
      &lt;h3&gt;settings&lt;/h3&gt;
    &lt;br&gt;
      &lt;h4&gt;transport&lt;/h4&gt;
    &lt;br&gt;
      &lt;label&gt;
        &lt;input type=&quot;radio&quot; name=&quot;transport&quot; value=&quot;libcurl&quot;&gt; libcurl
      &lt;/label&gt;
      &lt;br&gt;
      &lt;label&gt;
        &lt;input type=&quot;radio&quot; name=&quot;transport&quot; value=&quot;epoxy&quot; checked=&quot;&quot;&gt; epoxy (default)
      &lt;/label&gt;
    &lt;br&gt;
      &lt;h4&gt;search engine&lt;/h4&gt;
      &lt;br&gt;
      &lt;select id=&quot;searchEnginePicker&quot; style=&quot;width:100%;&quot;&gt;
        &lt;option value=&quot;google&quot;&gt;google&lt;/option&gt;
        &lt;option value=&quot;bing&quot;&gt;bing&lt;/option&gt;
        &lt;option value=&quot;duckduckgo&quot;&gt;duckduckgo&lt;/option&gt;
        &lt;option value=&quot;brave&quot;&gt;brave&lt;/option&gt;
      &lt;/select&gt;
      &lt;br&gt;
      &lt;h4&gt;tab cloak&lt;/h4&gt;
      &lt;select id=&quot;cloak&quot; style=&quot;width:100%;&quot;&gt;
        &lt;option value=&quot;aboutblank&quot;&gt;about:blank&lt;/option&gt;
        &lt;option value=&quot;blob&quot;&gt;blob url&lt;/option&gt;
        &lt;option value=&quot;off&quot;&gt;off&lt;/option&gt;
      &lt;/select&gt;
      &lt;small style=&quot;color:var(--text-muted);&quot;&gt;applies next time the site opens&lt;/small&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;iframe id=&quot;browser&quot; sandbox=&quot;allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads&quot; allow=&quot;autoplay; fullscreen&quot;&gt;&lt;/iframe&gt;
  &lt;div id=&quot;load-bar&quot;&gt;&lt;/div&gt;

  &lt;script src=&quot;app.js&quot; type=&quot;module&quot;&gt;&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>\n</foreignObject>\n</svg>\n