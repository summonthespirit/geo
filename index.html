<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google</title>
  <link rel="icon" href="https://google.com/favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="/cloak.js"></script>
  <style>
    :root {
        --bg-dark: #0f141c;
        --surface: rgba(22, 29, 41, 0.85);
        --border: #2a384d;
        --glow: #0084ff;
        --text-color: #ffffff;
        --text-muted: #8a9bb5;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        margin: 0;
        padding: 0;
        color: var(--text-color);
        font-family: "Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        position: relative;
        overflow: hidden;
        background-color: var(--bg-dark);
        height: 100vh;
    }
    
    #ad {
    position: fixed;
    top: calc(54% + 50px);
    left: 50%;
    transform: translateX(-50%);
    width: 728px;
    height: 90px;
    z-index: 2;
  }

@media (max-width: 760px) {
  #ad { display: none; }
}


body:has(#browser.visible) #ads { 
  display: none;
}

    .background-video { 
        position: fixed; 
        inset: 0; 
        z-index: 0; 
        width: 100vw; 
        height: 100vh; 
        object-fit: cover; 
        pointer-events: none;
        filter: brightness(0.8);
    }

    header {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        height: 60px;
        padding: 0 2rem;
        position: relative;
        z-index: 10;
        background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
    }

    input, button, select {
        background: var(--surface);
        color: var(--text-color);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 16px;
        user-select: none;
        font-weight: 600;
        letter-spacing: 0.5px;
        backdrop-filter: blur(8px);
        transition: all 0.2s ease;
    }

    button:hover, input:focus {
        border-color: var(--glow);
        box-shadow: 0 0 12px rgba(0, 132, 255, 0.4);
        outline: none;
    }

    .title {
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        pointer-events: none;
        margin: 0;
        text-align: center;
    }

    .title img {
        max-width: min(250px, 75vw);
        width: 100%;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.8));
    }

    #search {
        position: fixed;
        top: 54%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        pointer-events: auto;
        margin: 0;
        text-align: center;
        transition: all 0.3s ease;
    }

    #search input {
        width: min(480px, 85vw);
        height: 52px;
        border-radius: 26px;
        text-align: center;
        background: rgba(15, 20, 28, 0.75);
        border: 2px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
        font-size: 1.05rem;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        font-family: 'Sora', sans-serif;
    }

    #search input::placeholder {
        color: var(--text-muted);
    }

    #search input:focus {
        border-color: #ffffff;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: #0f141c;
        opacity: 1;
        transition: opacity 0.5s ease;
      }
    
    #loading-screen.hide {
      opacity: 0;
      pointer-events: none;
    }

    #loading-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #status {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
      z-index: 10;
      letter-spacing: 0.03em;
    }

    #overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(10, 14, 20, 0.85);
        backdrop-filter: blur(6px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 100;
    }

    #overlay.active {
        opacity: 1;
        pointer-events: auto;
    }

    #settings {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(90vw, 440px);
        max-height: 80vh;
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(16px);
        z-index: 101;
    }

    #settings h3 {
        margin-top: 0;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-size: 1.1rem;
        color: #ffffff;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
    }

    #gear {
        cursor: pointer;
        font-size: 20px;
    }

    #browser {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        border: none;
        background: var(--bg-dark);
        z-index: 312456643241354676563424365476856746353454657;
        display: none;
    }
    
    #browser.visible { 
      display: block; 
    }

    #load-bar {
      position: fixed;
      top: 0; left: 0;
      height: 3px;
      width: 0%;
      background: #ffffff;
      box-shadow: 0 0 6px rgba(126,200,255,0.6);
      z-index: 25;
      opacity: 0;
      border-radius: 0 2px 2px 0;
      
      body:has(#browser.visible) > :not(#browser):not(script):not(style):not(link):not(noscript),
html:has(#browser.visible) > :not(head):not(body) {
  display: none !important;
}
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&amp;display=swap" rel="stylesheet">
</head>
<body class="default">
  <video class="background-video" id="background-video" autoplay="true" muted playsinline="true" preload="auto" aria-hidden="true" loop="">
    <source src="img/bg.mp4" type="video/mp4">
  </video>
  
  <header>
   <span id="gear"><i class="fa-solid fa-gear"></i></span>
  </header>

  <div class="title">
    <img src="img/logo.png" alt="logo">
  </div>

  <form id="search">
    <input id="url" type="text" class="search-input search" placeholder="search the web or enter a url." autocomplete="off" autocorrect="off" spellcheck="false">
  </form>
  
  <p id="status"></p>

  <div id="overlay" class="">
    <div id="settings" class="">
      <h3>settings</h3>
    <br>
      <h4>transport</h4>
    <br>
      <label>
        <input type="radio" name="transport" value="libcurl" checked=""> libcurl
      </label>
      <br>
      <label>
        <input type="radio" name="transport" value="epoxy"> epoxy
      </label>
    <br>
      <h4>search engine</h4>
      <br>
      <select id="searchEnginePicker" style="width:100%;">
        <option value="google">google</option>
        <option value="bing">bing</option>
        <option value="duckduckgo">duckduckgo</option>
        <option value="brave">brave</option>
      </select>
      <br>
      <h4>tab cloak</h4>
      <select id="cloak" style="width:100%;">
        <option value="aboutblank">about:blank</option>
        <option value="off">off</option>
      </select>
      <small style="color:var(--text-muted);">applies next time the site opens</small>
    </div>
  </div>

  <iframe id="browser" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads" allow="autoplay; fullscreen"></iframe>
  <div id="load-bar"></div>

  <script type="module">
  import { chooseWisp } from './wisp-check.js';
import { attachControls } from './controls.js';

const status = document.getElementById('status');
const bgVideo = document.getElementById('background-video');

bgVideo.play().catch(() => {
  window.addEventListener('click', () => { bgVideo.play(); }, { once: true });
});

const settings = document.getElementById('settings');
const gear = document.getElementById('gear');
const overlay = document.getElementById('overlay');
const transports = document.querySelectorAll('input[name="transport"]');
const searchEnginePicker = document.getElementById('searchEnginePicker');
const iframe = document.getElementById('browser');
const titleDiv = document.querySelector('.title');
const searchForm = document.getElementById('search');
const urlInput = document.getElementById('url');
const loadBar = document.getElementById('load-bar');

gear.onclick = () => { overlay.classList.toggle('active'); settings.classList.toggle('open'); };
overlay.onclick = e => { if (e.target === overlay) { overlay.classList.remove('active'); settings.classList.remove('open'); } };
document.onkeydown = e => { if (e.key === 'Escape') { overlay.classList.remove('active'); settings.classList.remove('open'); } };

let pendingQuery = null;
let handleSearch = null;
searchForm.addEventListener('submit', event => {
  event.preventDefault();
  const q = urlInput.value.trim();
  if (!q) return;
  if (handleSearch) {
    handleSearch(q);
  } else {
    pendingQuery = q;
    status.style.display = '';
    status.textContent = 'starting up… your search will open when ready';
  }
});

function startLoadBar() {
  loadBar.style.transition = 'none';
  loadBar.style.width = '0%';
  loadBar.style.opacity = '1';
  void loadBar.offsetWidth;
  loadBar.style.transition = 'width 0.3s ease';
  loadBar.style.width = '85%';
}

function finishLoadBar() {
  loadBar.style.width = '100%';
  setTimeout(() => {
    loadBar.style.opacity = '0';
    setTimeout(() => { loadBar.style.width = '0%'; }, 300);
  }, 200);
}

const BASE = new URL('./', document.baseURI).pathname;
const abs = p => new URL(p, document.baseURI).href;
const host = (() => {
  try {
    if (window.top !== window.self && window.frameElement && window.frameElement.hasAttribute('data-svghost')) return window.parent;
  } catch {}
  return window;
})();
const WISP_SERVERS = [
  'wss://w.oneyplaysbestf.art/',
  'wss://wisp.mercurywork.shop/wisp/',
  'wss://wisp.mercurywork.shop/',
  'wss://wisp-85822.wasmer.app/',
  'wss://arctic.lat/wisp/',
  'wss://anura.pro/',
  'wss://arctic.lat/_q/',
  'wss://wisp.freewisp.org/',
  'wss://gointospace.app/wisp/',
  'wss://edu.robert.rest/'
];
const DEFAULT_WISP = WISP_SERVERS[0];
const DEFAULT_TRANSPORT = 'libcurl';

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

const getSavedTransport = () => {
  const t = store.get('fish-transport');
  return t === 'epoxy' || t === 'libcurl' ? t : DEFAULT_TRANSPORT;
};
const getSavedWisp = () => store.get('fish-wisp') || DEFAULT_WISP;

const loadScript = src => new Promise((resolve, reject) => {
  const s = document.createElement('script');
  s.src = src;
  s.onload = resolve;
  s.onerror = () => reject(new Error('failed to load ' + src));
  document.head.append(s);
});

async function makeTransport(method, wisp) {
  const mod = await import(BASE + method + '/index.mjs');
  const Client = mod.default;
  return new Client({ wisp });
}

boot: try {
  if (!navigator.onLine) {
    status.style.display = '';
    status.textContent = 'you are offline: the proxy needs internet (games still work)';
    handleSearch = () => {
      status.style.display = '';
      status.textContent = 'you are offline: reconnect to browse';
    };
    pendingQuery = null;
    window.addEventListener('online', () => location.reload(), { once: true });
    break boot;
  }

  status.textContent = 'registering service worker…';
  const registration = await navigator.serviceWorker.register(BASE + 'sw.js', {
    scope: BASE,
    updateViaCache: 'none',
  });
  await navigator.serviceWorker.ready;

  if (!navigator.serviceWorker.controller) {
    await new Promise(resolve =>
      navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true })
    );
  }
  const serviceworker = navigator.serviceWorker.controller ?? registration.active;
  if (!serviceworker) throw new Error('the service worker did not become active.');

  status.textContent = 'loading engine…';
  for (const src of ['scram/scramjet.js', 'controller/controller.api.js']) {
    await loadScript(BASE + src);
  }
  const api = window.$scramjetController;

  let utils = null;
  for (const name of ['scramjet-utils.mjs', 'scramjet-utils.js']) {
    try {
      const mod = await import(BASE + 'utils/' + name);
      utils = { ...(mod.default ?? {}), ...mod };
      break;
    } catch (err) {
      console.warn('utils import failed for', name, err);
    }
  }
  if (!utils) console.warn('scramjet-utils not loaded: plugins disabled');

  status.textContent = 'connecting transport…';
  let currentTransport = getSavedTransport();
  status.textContent = 'checking wisp servers…';
  const picked = await chooseWisp({
    servers: [store.get('fish-wisp'), ...WISP_SERVERS],
    onStatus: t => { status.style.display = ''; status.textContent = t; },
  });
  let WISP = picked.url;
  if (picked.manual) store.set('fish-wisp', WISP);
  let transport;
  try {
    transport = await makeTransport(currentTransport, WISP);
  } catch (err) {
    console.warn('transport failed, falling back to epoxy', err);
    currentTransport = 'epoxy';
    store.set('fish-transport', 'epoxy');
    transport = await makeTransport('epoxy', WISP);
  }

  status.textContent = 'starting controller…';
  const controller = new api.Controller({
    serviceworker,
    transport,
    config: {
      prefix: abs(BASE + '~/sj/'),
      scramjetPath: abs(BASE + 'scram/scramjet.js'),
      wasmPath: abs(BASE + 'scram/scramjet.wasm'),
      injectPath: abs(BASE + 'controller/controller.inject.js'),
    },
  });
  await controller.wait();

  setInterval(() => {
    navigator.serviceWorker.controller?.postMessage('keepalive');
  }, 15000);

  const plugins = [];
  if (utils?.UrlWatcherPlugin) plugins.push(new utils.UrlWatcherPlugin(() => finishLoadBar()));
  const frame = controller.createFrame(iframe, { plugins });

  const radioCheck = document.querySelector(`input[name="transport"][value="${currentTransport}"]`);
  if (radioCheck) radioCheck.checked = true;
  searchEnginePicker.value = store.get('selectedSearchEngine') || 'brave';

  status.textContent = 'ready';
  setTimeout(() => { status.style.display = 'none'; }, 1000);

  const searchTemplates = {
    google: 'https://www.google.com/search?q=%s',
    bing: 'https://www.bing.com/search?q=%s',
    duckduckgo: 'https://duckduckgo.com/?q=%s',
    brave: 'https://search.brave.com/search?q=%s',
  };

  function search(input) {
    if (!input) return '';
    try { return new URL(input).toString(); } catch {}
    try {
      const url = new URL(`http://${input}`);
      if (url.hostname.includes('.')) return url.toString();
    } 
    catch {}
    const engine = store.get('selectedSearchEngine') || 'brave';
    const template = searchTemplates[engine] || searchTemplates.brave;
    return template.replace('%s', encodeURIComponent(input));
  }

  async function applyTransport() {
    const next = await makeTransport(currentTransport, WISP);
    await controller.setTransport(next);
  }

  transports.forEach(radio => {
    radio.addEventListener('change', async event => {
      currentTransport = event.target.value;
      store.set('fish-transport', currentTransport);
      await applyTransport();
    });
  });

  searchEnginePicker.addEventListener('change', event => {
    store.set('selectedSearchEngine', event.target.value);
  });

  iframe.addEventListener('load', finishLoadBar);

  handleSearch = query => {
    bgVideo.pause();
    bgVideo.muted = true;

    const target = search(query);

    titleDiv.style.display = 'none';
    searchForm.style.position = 'fixed';
    searchForm.style.top = '15px';
    searchForm.style.left = '2rem';
    searchForm.style.transform = 'none';

    startLoadBar();
    iframe.classList.add('visible');
    frame.go(target);
  };

  let hashed = '';
  const fromHash = () => {
    let h = host.location.hash.slice(1);
    try { h = decodeURIComponent(h); } catch {}
    return h.trim();
  };
  const openHash = () => {
    const h = fromHash();
    if (h && h !== hashed) {
      hashed = h;
      handleSearch(h);
    }
  };
  host.addEventListener('hashchange', openHash);

  attachControls({
    iframe,
    go: q => handleSearch(q),
    onurl: u => {
      hashed = u;
      try { host.history.replaceState(null, '', '#' + u); } catch {}
    },
    home: () => {
      hashed = '';
      try { host.history.replaceState(null, '', host.location.pathname + host.location.search); } catch {}
      iframe.classList.remove('visible');
      iframe.src = 'about:blank';
      titleDiv.style.display = '';
      searchForm.style.position = '';
      searchForm.style.top = '';
      searchForm.style.left = '';
      searchForm.style.transform = '';
      bgVideo.muted = false;
      bgVideo.play().catch(() => {});
    },
  });

  if (pendingQuery) {
    const q = pendingQuery;
    pendingQuery = null;
    handleSearch(q);
  } else {
    openHash();
  }
} catch (err) {
  status.style.display = '';
  status.style.color = '#f87171';
  status.textContent = 'error: ' + err.message;
  console.error('init error:', err);
}
  </script>
</body>
</html>
